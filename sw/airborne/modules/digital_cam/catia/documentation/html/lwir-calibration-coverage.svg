  <text x="317" y="551" fill="#555555" font-size="14" font-family="DejaVu Sans" font-weight="normal">Target footprint in sensor</text>
  <text x="596" y="364" fill="#111111" font-size="18" font-family="DejaVu Sans" font-weight="bold">06  Change distance</text>
  <g transform="translate(596 384)">
    <rect x="0" y="0" width="240" height="145" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" />
    <line x1="120" y1="0" x2="120" y2="145" stroke="#d1d5db" stroke-width="1.5" />
    <line x1="0" y1="72" x2="240" y2="72" stroke="#d1d5db" stroke-width="1.5" />
    <polygon points="95,50 145,50 145,95 95,95" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
