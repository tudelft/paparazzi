  <text x="596" y="551" fill="#555555" font-size="14" font-family="DejaVu Sans" font-weight="normal">Target footprint in sensor</text>
  <text x="40" y="634" fill="#ca8a04" font-size="24" font-family="DejaVu Sans" font-weight="bold">25-35 varied fitting views</text>
  <text x="40" y="673" fill="#d97706" font-size="23" font-family="DejaVu Sans" font-weight="bold">+ 5-8 new views kept only for checking</text>
  <text x="40" y="714" fill="#555555" font-size="17" font-family="DejaVu Sans" font-weight="normal">Include all edges and corners; these six poses are examples, not the full set.</text>
</svg>