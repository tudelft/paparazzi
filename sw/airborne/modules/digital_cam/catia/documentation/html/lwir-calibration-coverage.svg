<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 740" width="880" height="740">
  <title>Let the corners visit the whole image.</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 Z" fill="#222222" />
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="740" fill="#ffffff" stroke="#dedede" stroke-width="2" />
  <rect x="32" y="32" width="6" height="54" fill="#ca8a04" stroke="none" stroke-width="2" />
  <text x="54" y="54" fill="#111111" font-size="26" font-family="DejaVu Sans" font-weight="bold">Let the corners visit the whole image.</text>
  <text x="54" y="83" fill="#555555" font-size="16" font-family="DejaVu Sans" font-weight="normal">Keep the complete border visible / keep flight focus unchanged</text>
  <text x="38" y="130" fill="#111111" font-size="18" font-family="DejaVu Sans" font-weight="bold">01  Center</text>
  <g transform="translate(38 150)">
    <rect x="0" y="0" width="240" height="145" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" />
    <line x1="120" y1="0" x2="120" y2="145" stroke="#d1d5db" stroke-width="1.5" />
    <line x1="0" y1="72" x2="240" y2="72" stroke="#d1d5db" stroke-width="1.5" />
    <polygon points="70,25 160,25 160,105 70,105" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
  </g>
  <text x="38" y="317" fill="#555555" font-size="14" font-family="DejaVu Sans" font-weight="normal">Target footprint in sensor</text>
  <text x="317" y="130" fill="#111111" font-size="18" font-family="DejaVu Sans" font-weight="bold">02  Upper left</text>
  <g transform="translate(317 150)">
    <rect x="0" y="0" width="240" height="145" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" />
    <line x1="120" y1="0" x2="120" y2="145" stroke="#d1d5db" stroke-width="1.5" />
    <line x1="0" y1="72" x2="240" y2="72" stroke="#d1d5db" stroke-width="1.5" />
    <polygon points="15,8 105,8 105,88 15,88" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
  </g>
  <text x="317" y="317" fill="#555555" font-size="14" font-family="DejaVu Sans" font-weight="normal">Target footprint in sensor</text>
  <text x="596" y="130" fill="#111111" font-size="18" font-family="DejaVu Sans" font-weight="bold">03  Lower right</text>
  <g transform="translate(596 150)">
    <rect x="0" y="0" width="240" height="145" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" />
