PC03    SPI2_MOSI           SPI     AF:SPI2_MOSI
PC04    BATT_VOLTAGE_SENS   ADC     ADC1_IN14
PC05    BATT_CURRENT_SENS   ADC     ADC1_IN15
PC06    USART6_TX           UART    AF:USART6_TX
PC07    USART6_RX           UART    AF:USART6_RX
PC08    SERVO2              PWM     AF:TIM8_CH3 ()
PC09    SERVO1              PWM     AF:TIM8_CH4 ()
PC10    USART3_TX           UART    AF:USART3_TX
PC11    USART3_RX           UART    AF:USART3_RX
PC12    UART5_TX            UART    AF:UART5_TX
PC13    FLASH_CS            OUTPUT  PUSHPULL SPEED_HIGH FLOATING LEVEL_HIGH # SPI2, SPI_SELECT_SLAVE4 (dataflash)
PC14    SPI1_CS          OUTPUT  PUSHPULL SPEED_HIGH FLOATING LEVEL_HIGH # SPI1, SPI_SELECT_SLAVE1 and SLAVE6 (IMU ICM42688)
PC15    OSC32_OUT           PASSIVE

PD02    UART5_RX            UART    AF:UART5_RX

PH00    OSC_IN              SYS     AF0
PH01    OSC_OUT             SYS     AF0

