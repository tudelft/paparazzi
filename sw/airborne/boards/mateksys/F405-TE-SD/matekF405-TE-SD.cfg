MCU_MODEL = STM32F405RGTx
CHIBIOS_VERSION = 3.0

HEADER
/*
 * Board identifier.
 */
#define BOARD_MATEKF405_TE_SD
#define BOARD_NAME                  "MATEKSYS F405-TE-SD"
#define BOARD_OTG_NOVBUSSENS 1

/*
 * Board oscillators-related settings.
 */
#if !defined(STM32_LSECLK)
#define STM32_LSECLK                0
#endif

#if !defined(STM32_HSECLK)
#define STM32_HSECLK                8000000U
#endif

/*
 * Board voltages.
 * Required for performance limits calculation.
 */
#define STM32_VDD                   300U

/*
 * MCU type as defined in the ST header.
 */
#define STM32F405xx

CONFIG


# PIN NAME PERIPH_TYPE AF_NUMBER or
# PIN NAME FUNCTION PP_or_OPENDRAIN PIN_SPEED PULL_RESISTOR INITIAL_LEVEL AF_NUMBER
# SPEED : SPEED_VERYLOW, SPEED_LOW, SPEED_MEDIUM, SPEED_HIGH
#
# DEFAULT
DEFAULT                 INPUT   PUSHPULL SPEED_VERYLOW PULLDOWN LEVEL_LOW  AF0

# ACTIVE PINS
PA00    UART4_TX            UART    AF:UART4_TX
PA01    UART4_RX            UART    AF:UART4_RX
PA02    USART2_TX           UART    AF:USART2_TX
PA03    USART2_RX           UART    AF:USART2_RX
PA04    PINIO1              OUTPUT  PUSHPULL SPEED_LOW FLOATING LEVEL_LOW
PA05    SPI1_SCK            SPI     AF:SPI1_SCK
PA06    SERVO10             PWM     AF:TIM13_CH1 ()
PA07    SPI1_MOSI           SPI     AF:SPI1_MOSI
PA08    SERVO4              PWM     AF:TIM1_CH1 ()
PA09    USART1_TX           UART    AF:USART1_TX
PA10    USART1_RX           UART    AF:USART1_RX
PA11    OTG_FS_DM           OTG     AF:USB_OTG_FS_DM 
PA12    OTG_FS_DP           OTG     AF:USB_OTG_FS_DP
PA13    LED2           LED
PA14    LED1           LED
PA15    SERVO8              PWM     AF:TIM2_CH1 ()

PB00    RSSI_ADC_PIN        ADC     ADC1_IN8
PB01    SERVO12             PWM     AF:TIM3_CH4 ()
PB02    BOOT1               PASSIVE      
PB03    SERVO7              PWM     AF:TIM2_CH2 ()
PB04    SPI1_MISO           SPI     AF:SPI1_MISO
PB05    PINIO2              OUTPUT  PUSHPULL SPEED_LOW FLOATING LEVEL_LOW
PB06    SERVO11             PWM     AF:TIM4_CH1 ()
