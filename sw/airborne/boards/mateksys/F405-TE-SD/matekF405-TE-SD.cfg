PB13    SPI2_SCK            SPI     AF:SPI2_SCK
PB14    SERVO9              PWM     AF:TIM12_CH1 ()
PB15    SERVO3              PWM     AF:TIM12_CH2 ()

PC00    PRESSURE_SENS       ADC     ADC1_IN10
PC01    SDCARD_CS           OUTPUT  PUSHPULL SPEED_HIGH FLOATING LEVEL_HIGH # SPI2, SPI_SELECT_SLAVE3 (micro SD card)
